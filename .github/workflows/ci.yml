name: CI

on:
  push:
    branches: ["main", "feat/**", "ci/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run unit and API integration tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production container image
        run: docker build -t student-api:ci .

      - name: Smoke-test container health, inference, and drift supervision
        run: |
          docker run -d --name student-api -p 8000:8000 student-api:ci
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"gender":"female","race_ethnicity":"group B","parental_level_of_education":"bachelor\u0027s degree","lunch":"standard","test_preparation_course":"completed","reading_score":75.0,"writing_score":78.0}'
          curl -fsS http://127.0.0.1:8000/monitor/drift
          docker rm -f student-api
